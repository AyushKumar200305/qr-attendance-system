{% extends "base.html" %}
{% block title %}Student Stats{% endblock %}
{% block content %}
<div style="max-width:440px;margin:40px auto;">
  <div class="pt" style="text-align:center;">
    <div style="font-size:2.5rem;margin-bottom:10px;">📊</div>
    <h1>Student Stats</h1>
    <p>Enter a roll number to view attendance and detention risk.</p>
  </div>
  <div class="card">
    <form method="POST">
      <div class="fg">
        <label class="lbl">Roll Number</label>
        <input name="roll_no" placeholder="e.g. 24BCS001" required autofocus
               oninput="this.value=this.value.toUpperCase()"
               style="font-family:var(--mono);font-size:1rem;padding:13px;font-weight:700;"/>
      </div>
      <button type="submit" class="btn btn-p btn-bl">View Stats →</button>
    </form>
  </div>
</div>
{% endblock %}
